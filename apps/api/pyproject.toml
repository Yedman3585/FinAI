[project]
name = "finai-api"
version = "0.1.0"
description = "FInAI backend API"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "python-dotenv==1.0.1",
  "httpx==0.28.1",
  "yfinance==0.2.51"
]

[tool.ruff]
line-length = 100
target-version = "py311"
